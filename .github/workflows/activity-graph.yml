
name: Activity Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activity-graph:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Generate contribution graph
        uses: alexcerezo/activity-graph@v1

      - name: Apply Cyberpunk neon colors
        run: python scripts/customize_activity_graph.py

      - name: Commit customized graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod -R u+rwX .git

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add activity-graph.svg activity-graph-mobile.svg README.md

          if ! git diff --cached --quiet; then
            git -c core.editor=true commit -m "Update cyberpunk activity graph"
            git push
          else
            echo "No graph changes to commit."
          fi
