
name: Activity Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activity-graph:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Generate contribution graph
        uses: alexcerezo/activity-graph@v1
        with:
          username: Samoody

          - name: Apply Cyberpunk neon colors
        run: python scripts/customize_activity_graph.py

      - name: Save customized graphs
        run: |
          mkdir -p "$RUNNER_TEMP/cyberpunk"
          cp activity-graph.svg "$RUNNER_TEMP/cyberpunk/"
          cp activity-graph-mobile.svg "$RUNNER_TEMP/cyberpunk/"

      - name: Checkout clean repository
        uses: actions/checkout@v4
        with:
          path: publish
          clean: true
          persist-credentials: true

      - name: Copy customized graphs
        run: |
          cp "$RUNNER_TEMP/cyberpunk/activity-graph.svg" publish/
          cp "$RUNNER_TEMP/cyberpunk/activity-graph-mobile.svg" publish/

      
      - name: Commit customized graph
        working-directory: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git reset --hard origin/main

          cp "$RUNNER_TEMP/cyberpunk/activity-graph.svg" activity-graph.svg
          cp "$RUNNER_TEMP/cyberpunk/activity-graph-mobile.svg" activity-graph-mobile.svg

          git add activity-graph.svg activity-graph-mobile.svg

          if ! git diff --cached --quiet; then
            git -c core.editor=true commit -m "Update cyberpunk activity graph"
            git push origin main
          else
            echo "No graph changes to commit."
          fi

