
name: Activity Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activity-graph:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: source

      - name: Generate contribution graph
        uses: alexcerezo/activity-graph@v1
        with:
          username: Samoody

      - name: Apply Cyberpunk neon colors
        run: python source/scripts/customize_activity_graph.py

      - name: Prepare clean checkout
        uses: actions/checkout@v4
        with:
          path: publish
          clean: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy customized graphs
        run: |
          cp activity-graph.svg publish/activity-graph.svg
          cp activity-graph-mobile.svg publish/activity-graph-mobile.svg

      - name: Commit customized graph
        working-directory: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add activity-graph.svg activity-graph-mobile.svg

          if ! git diff --cached --quiet; then
            git -c core.editor=true commit -m "Update cyberpunk activity graph"
            git push
          else
            echo "No graph changes to commit."
          fi
